    <script>
        // Функция для парсинга UTM-меток из URL
        function parseUtmParams() {
            // Получаем строку запроса из URL
            const queryString = window.location.search;
            // Если строка запроса пустая, прекращаем выполнение функции
            if (!queryString) return {};
            
            // Создаем объект для хранения UTM-меток
            const utmParams = {};
            
            // Создаем объект URLSearchParams для удобного парсинга параметров
            const urlParams = new URLSearchParams(queryString);
            
            // Массив с названиями UTM-меток, которые мы хотим отслеживать
            const utmTags = ['utm_source', 'utm_medium', 'utm_campaign', 'utm_term', 'utm_content'];
            
            // Проходим по всем возможным UTM-меткам и добавляем их в объект, если они есть
            utmTags.forEach(tag => {
                if (urlParams.has(tag)) {
                    utmParams[tag] = urlParams.get(tag);
                }
            });
            
            return utmParams;
        }

        // Функция для добавления UTM-меток ко всем ссылкам на странице
        function addUtmToLinks() {
            // Получаем UTM-метки из URL
            const utmParams = parseUtmParams();
            
            // Если UTM-меток нет, прекращаем выполнение функции
            if (Object.keys(utmParams).length === 0) return;
            
            // Получаем все ссылки на странице
            const links = document.querySelectorAll('a[href]');
            
            // Создаем строку с UTM-метками для добавления к ссылкам
            const utmString = Object.entries(utmParams)
                .map(([key, value]) => `${key}=${encodeURIComponent(value)}`)
                .join('&');
            
            // Проходим по всем ссылкам и добавляем UTM-метки
            links.forEach(link => {
                const href = link.getAttribute('href');
                
                // Пропускаем якоря, телефоны, почты и другие специальные ссылки
                if (href.startsWith('#') || href.startsWith('tel:') || href.startsWith('mailto:')) {
                    return;
                }
                
                // Если в ссылке уже есть UTM-метки, не добавляем новые
                if (href.includes('utm_')) {
                    return;
                }
                
                // Добавляем UTM-метки к ссылке
                const separator = href.includes('?') ? '&' : '?';
                link.setAttribute('href', href + separator + utmString);
            });
        }

        // Запускаем функцию после загрузки страницы
        document.addEventListener('DOMContentLoaded', addUtmToLinks);
        // JavaScript для переключения вкладок
        document.addEventListener('DOMContentLoaded', function() {
            const tabButtons = document.querySelectorAll('.tab-button');
            const tabContents = document.querySelectorAll('.tab-content');

            tabButtons.forEach(button => {
                button.addEventListener('click', () => {
                    // Удаление активного класса у всех кнопок и контента
                    tabButtons.forEach(btn => btn.classList.remove('active'));
                    tabContents.forEach(content => content.classList.remove('active'));

                    // Добавление активного класса к нажатой кнопке
                    button.classList.add('active');

                    // Показ соответствующего контента
                    const tabId = button.getAttribute('data-tab');
                    document.getElementById(tabId).classList.add('active');
                });
            });
        });
    </script>
